[package]
name = "dyn-loader"
version = "0.7.1"
edition = "2024"
description = "Standardized module loading protocol over the C ABI: language-agnostic interface tables, ref-counted interface references and single-owner data boxes for .so/.dll/.dylib modules. Includes a Rust-native fat-pointer fast path (same-compiler-version clause)."
license = "Apache-2.0"
repository = "https://github.com/avx16384/dyn-loader"
readme = "README.md"

[features]
default = ["abi"]
# Mode 2 — the C interface-table layer (AbiTable / AbiRef / AbiBox) and the
# `abi_vtable` attribute macro. Disable for Rust-only hosts that only use
# the native fat-pointer bridge.
abi = ["dep:abi-vtable-macro"]

[dependencies]
libloading = "0.8"
anyhow = "1"
abi-vtable-macro = { path = "../abi-vtable-macro", version = "0.3", optional = true }

# Independent repository root — never joins a parent workspace.
[workspace]
