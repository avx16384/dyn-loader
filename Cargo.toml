[package]
name = "dyn-loader"
version = "0.8.0"
edition = "2024"
description = "The loading gate and the Rust-native fat-pointer bridge of the dyn protocol: load a trait object from a .so/.dll/.dylib and get a safe, ref-counted handle to it (same-compiler-version clause)."
license = "Apache-2.0"
repository = "https://github.com/avx16384/dyn-loader"
readme = "README.md"

[features]
# The load-side reconciliation: compiler facts are mapped to ABI levels and
# compared before a module is dialled. Optional — a host that already knows
# its modules match does not need the policy layer.
abi-map = ["dep:dyn-abi-map"]

[dependencies]
libloading = "0.8"
anyhow = "1"
dyn-abi-map = { path = "../dyn-abi-map", version = "0.1", optional = true }

# Independent repository root — never joins a parent workspace.
[workspace]
